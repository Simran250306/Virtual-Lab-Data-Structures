<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link rel="stylesheet" href="login.css" />
  <style>
    .input-group select {
      background-color: rgba(255, 255, 255, 0.75);
      width: 100%;
      padding: 12px 15px;
      border: 1px solid rgba(200, 200, 200, 0.5);
      border-radius: 6px;
      font-size: 15px;
      color: #333;
      box-sizing: border-box;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Forgot Password</h1>
    <form action="forgot_password.php" method="post">
      <div class="input-group">
        <label for="role">Account Type</label>
        <select id="role" name="role" required>
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="input-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="input-group">
        <label for="security_question">Security Question</label>
        <select id="security_question" name="security_question" required>
          <option value="pet_name">What is your first pet's name?</option>
          <option value="mother_maiden">What is your mother's maiden name?</option>
          <option value="birth_city">In which city were you born?</option>
          <option value="favourite_teacher">Who was your favorite school teacher?</option>
          <option value="favourite_food">What is your favorite food?</option>
        </select>
      </div>
      <div class="input-group">
        <label for="security_answer">Security Answer</label>
        <input type="text" id="security_answer" name="security_answer" required />
      </div>
      <button type="submit" class="login-button">Continue Reset</button>
    </form>
    <div class="extra-links">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</body>
</html>
